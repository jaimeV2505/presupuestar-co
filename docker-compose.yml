services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: presupuestar-backend
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PYTHONUNBUFFERED=1
      - DB_PATH=/app/data_db/presupuestar.db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - db_data:/app/data_db
    networks:
      - presupuestar

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: presupuestar-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - presupuestar

volumes:
  db_data:

networks:
  presupuestar:
    driver: bridge
