# ═══════════════════════════════════════════════════════════════════════════
# SHIELD — LA MURALLA: 20 pasos por push. Un rojo y NADA se despliega.
# Filosofia de la casa: cada bug de produccion FUNDA un guardian que extingue
# su clase entera. Este workflow los ejecuta TODOS contra dos motores de BD.
# ═══════════════════════════════════════════════════════════════════════════
name: SHIELD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ── BACKEND: candados + smoke + los dos viajes (sqlite y Postgres real) ──
  backend:
    name: "Backend — candados, smoke y viajes"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shield
          POSTGRES_PASSWORD: shield
          POSTGRES_DB: viaje
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shield" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      # Paso 0 — deps de PRODUCCION (requirements raiz: lo que Vercel instala)
      - name: "0) deps de produccion (raiz) + deps de prueba"
        run: |
          pip install -r requirements.txt
          pip install -r backend/requirements.txt

      # Paso 1 — compile total: sintaxis rota no pasa
      - name: "0.5) ARRANQUE: la app importa completa (un ImportError aqui = 500 total en prod)"
        run: cd backend && python -c "from app.main import app; print('la app respira:', len(app.routes), 'rutas')"

      - name: "1) compile total (todos los .py)"
        run: python -m compileall -q backend api scripts

      # Pasos 1b-1c — candados estaticos fundados por bugs reales
      - name: "1b) candado de NOMBRES (familia NameError)"
        run: python backend/tests/candado_nombres.py
      - name: "1c) candado de TAMANOS (String(N) vs literales, auto-testeado)"
        run: python backend/tests/candado_tamanos.py
      - name: "1d) candado del UNIVERSO (cero jsx muertos, rutas existen, robots con musculo)"
        run: python backend/tests/candado_universo.py
      - name: "1e) candado de AUTHZ (ninguna ruta nace desnuda)"
        run: python backend/tests/candado_authz.py
      - name: "1f) candado ANTI-DECORADOR (handlers unicos y puros)"
        run: python backend/tests/candado_decorador.py
      - name: "1g) candado del BACKUP (toda tabla viaja o esta excluida a proposito)"
        run: python backend/tests/candado_backup.py
      - name: "1h) candado del DINERO (BigInteger: los contratos estatales caben)"
        run: python backend/tests/candado_dinero.py

      # Paso 2 — smoke financiero: 8 familias exactas A PESO
      - name: "2) smoke financiero (IVA/AIU/liquidacion/constructor/balance/deducciones/fuentes/incidencia/descuento/explosion/transporte)"
        run: python backend/tests/smoke_financiero.py

      # Pasos 3-3f — LOS DOS VIAJES contra sqlite (rapido)
      - name: "3) VIAJE PRIVADO (sqlite) — la historia entera"
        run: python backend/tests/test_viaje_completo.py
      - name: "3f) VIAJE PUBLICO (sqlite) — el contrato estatal completo"
        run: python backend/tests/test_viaje_publico.py

      # Paso 3g — la base 2026 es SAGRADA (hash byte a byte)
      - name: "3g) base 2026 INMUTABLE (hash SHA-256)"
        run: python backend/tests/candado_base_inmutable.py

      # Paso 3b — contrato API: el frontend no llama fantasmas
      - name: "3b) contrato API (frontend -> rutas reales)"
        run: python backend/tests/candado_contrato_api.py

      # Paso 3c — paridad de migraciones PG <-> sqlite
      - name: "3c) cobertura de migraciones (paridad PG<->sqlite)"
        run: python backend/tests/candado_migraciones.py

      # Paso 3d — LOS DOS VIAJES contra POSTGRES 16 REAL (la personalidad estricta)
      - name: "3d) VIAJE PRIVADO contra Postgres real"
        env:
          DATABASE_URL: postgresql://shield:shield@localhost:5432/viaje
        run: python backend/tests/test_viaje_completo.py
      - name: "3d2) VIAJE PUBLICO contra Postgres real"
        env:
          DATABASE_URL: postgresql://shield:shield@localhost:5432/viaje
        run: python backend/tests/test_viaje_publico.py

      # Paso 3e — init_db x2: migraciones idempotentes (el re-deploy jamas rompe)
      - name: "3e) init_db x2 idempotente (Postgres)"
        env:
          DATABASE_URL: postgresql://shield:shield@localhost:5432/viaje
        run: |
          python -c "import sys; sys.path.insert(0,'backend'); from app.db import init_db; init_db(); init_db(); print('init_db x2 OK: idempotente')"

      # Paso 7 — cadena de suministro Python
      - name: "7) pip-audit (CVEs conocidas)"
        run: |
          pip install pip-audit
          # EXCEPCION DOCUMENTADA (26/8/2026): los CVEs de starlette se arreglan en
          # la rama 1.x, que exige Python>=3.10 y que fastapi 0.128 aun no adopta.
          # Ignorados con nombre — REVISAR EN SEPTIEMBRE si fastapi ya la abraza.
          pip-audit -r requirements.txt --strict --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-248 --ignore-vuln PYSEC-2026-249 --ignore-vuln PYSEC-2026-2280 --ignore-vuln PYSEC-2026-2281 || (echo '::warning::pip-audit encontro avisos' && pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-248 --ignore-vuln PYSEC-2026-249 --ignore-vuln PYSEC-2026-2280 --ignore-vuln PYSEC-2026-2281)

  # ── FRONTEND: el build REAL de Vite (la clase "InfoTip faltante") ──
  frontend:
    name: "Frontend — build real de Vite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      # Paso 6 — npm install + build real (imports rotos NO pasan)
      - name: "6) npm install + vite build (el build que corre Vercel)"
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      # Paso 8 — cadena de suministro JS
      - name: "8) npm audit high"
        working-directory: frontend
        run: npm audit --audit-level=high || echo '::warning::npm audit encontro avisos high'

  # ── SECRETOS: llaves quemadas no entran al repo ──
  gitleaks:
    name: "Gitleaks — llaves quemadas"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
