services:
  - type: web
    name: presupuestar-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DB_PATH
        value: /data/presupuestar.db
    disk:
      name: presupuestar-data
      mountPath: /data
      sizeGB: 1
