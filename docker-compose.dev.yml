# Desarrollo con hot-reload
# Uso: docker compose -f docker-compose.dev.yml up
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: presupuestar-backend-dev
    restart: unless-stopped
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app        # Hot-reload del código Python
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - presupuestar-dev

  frontend:
    image: node:22-alpine
    container_name: presupuestar-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - presupuestar-dev

networks:
  presupuestar-dev:
    driver: bridge
